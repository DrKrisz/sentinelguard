[project]
name = "sentinelguard"
version = "0.1.0"
description = "Lightweight defensive authentication log monitoring"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<1", "bandit>=1.9,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
